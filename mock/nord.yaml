# Hermes dashboard theme — Nord (https://www.nordtheme.com)
# Drop in <hermes-home>/dashboard-themes/nord.yaml, then pick "Nord" in the
# dashboard Appearance page (or PUT /api/dashboard/theme {"name": "nord"}).

name: nord
label: Nord
description: Frost and aurora on polar night — official Nord palette for the whole dashboard

palette:
  # Base surfaces — polar night ladder (nord0 → nord3).
  background: { hex: "#2E3440", alpha: 1 }
  midground: { hex: "#D8DEE9", alpha: 1 }        # text + primary fill — snow storm
  foreground: { hex: "#FFFFFF", alpha: 0 }        # invisible overlay (default)
  warmGlow: "rgba(136, 192, 208, 0.35)"           # frost-cyan glow on the backdrop
  noiseOpacity: 0.7

typography:
  fontSans: '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  fontMono: '"JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.55"
  letterSpacing: "-0.005em"

layout:
  radius: "0.5rem"
  density: comfortable

# Semantic component tokens (shadcn-style slots) — aurora roles on nord1 surfaces.
# Contrast-verified (WCAG 2.1) against the surfaces they render on.
colorOverrides:
  card: "#3B4252"
  cardForeground: "#ECEFF4"   # 8.73:1 on card
  popover: "#3B4252"
  popoverForeground: "#ECEFF4"
  primary: "#88C0D0"
  primaryForeground: "#2E3440"  # 6.24:1
  secondary: "#4C566A"
  secondaryForeground: "#ECEFF4"  # 6.40:1 on secondary
  muted: "#434C5E"
  # Status-bar / footer secondary text sits on bg or card — #9AA5B4 was 4.03:1 on
  # nord1 (AA-large only); #BCCCDC (nord5 tint) is 6.14:1 on nord1 and 7.62:1 on nord0.
  mutedForeground: "#BCCCDC"
  accent: "#81A1C1"
  accentForeground: "#2E3440"
  destructive: "#BF616A"
  destructiveForeground: "#ECEFF4"  # 3.55:1 on destructive bg (large/bold text)
  success: "#A3BE8C"
  warning: "#EBCB8B"
  border: "#4C566A"          # decorative hairline: 1.69:1 vs bg, 1.36:1 vs card (below the
                             # 3:1 non-text guideline; text on the surfaces carries meaning)
  input: "#434C5E"
  ring: "#88C0D0"

# The dashboard derives text-secondary (80% midground) and text-tertiary (65%)
# from `midground` over `background`. With midground #D8DEE9 on #2E3440 that
# yields 6.55:1 and 4.87:1 — both AA. Lock them explicitly so a midground tweak
# can't silently drop the status bar below AA.
componentStyles:
  page:
    terminalBackground: "#2E3440"
    terminalForeground: "#D8DEE9"
    textSecondary: "#B6BCC7"   # 6.55:1 on background — model/ctx/duration in chat footer
    textTertiary: "#9CA2AE"    # 4.87:1 on background — dim labels

# Raw CSS safety net for the chat status strip and any legacy text-muted-foreground
# call sites that bypass the DS tokens. Also wire the DS text-secondary/tertiary
# tokens to the locked Nord values: the host maps --color-muted-foreground to
# var(--color-text-secondary) = var(--text-secondary, <derived 80% mix>), and
# componentStyles.page.textSecondary lands on --component-page-text-secondary,
# which nothing reads — so without these lines every muted-foreground element
# renders the derived mix instead of the locked mutedForeground #BCCCDC.
#
# The DS base layer also paints every bare `code` element with
# background: var(--selection-bg, var(--midground)) — on Nord that is snow-storm
# #D8DEE9 behind dark text, a full light chip around every inline code span.
# Scope it to message/chat contexts (where the selection-style chip is wanted)
# and let `code` elsewhere render transparent. `.text-destructive` is hardcoded
# to #fb2c36 in the compiled utilities layer; route it through --color-destructive
# so the theme's nord11 #BF616A actually applies.
customCSS: |
  :root {
    --color-muted-foreground: #BCCCDC;
    --text-secondary: #BCCCDC;   /* == mutedForeground: 7.62:1 on background */
    --text-tertiary: #BCCCDC;    /* lift dim labels off the 4.87:1 derived value */
  }
  .text-muted-foreground, [class*="text-muted-foreground"] {
    color: #BCCCDC !important;
  }
  .text-destructive, [class*="text-destructive"] {
    color: var(--color-destructive) !important;
  }
  /* Inline-code chip only inside the chat tab (data-chat-active="true") and
     message/prose surfaces; transparent everywhere else. */
  code {
    background: transparent;
  }
  [data-chat-active="true"] code,
  [class*="message"] code,
  [data-message] code,
  .prose code {
    background: var(--selection-bg, var(--midground));
    color: var(--background);
  }
