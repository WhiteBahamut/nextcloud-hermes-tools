# Hermes skin — Nord (https://www.nordtheme.com)
# Frost blues on polar night, aurora accents. Themes CLI, TUI, and desktop GUI.

name: nord
description: Nord — frost and aurora on polar night (#2E3440)

colors:
  # Base surface — polar night.
  background: "#2E3440"

  # Text hierarchy — snow storm.
  banner_title: "#88C0D0"    # headings / primary — frost cyan
  ui_primary: "#88C0D0"
  banner_text: "#D8DEE9"     # body foreground
  ui_text: "#D8DEE9"
  banner_dim: "#81A1C1"      # muted / secondary — nord9, 4.64:1 on nord0 (nord3 fails at 1.69:1)
  ui_label: "#81A1C1"        # labels — frost blue

  # Brand accent — frost cyan.
  ui_accent: "#88C0D0"
  banner_accent: "#88C0D0"

  # Borders / rules — nord2.
  banner_border: "#434C5E"
  ui_border: "#434C5E"
  session_border: "#434C5E"
  input_rule: "#88C0D0"
  response_border: "#81A1C1"

  # Tool marker + thinking — aurora purple / teal so they stand apart from accent.
  ui_tool: "#C9A9CE"         # lightened nord15 — 5.98:1 on nord0 (pure nord15 is 4.41 AA-large)
  ui_thinking: "#8FBCBB"

  # Semantic status — aurora green / yellow / red.
  ui_ok: "#A3BE8C"
  ui_warn: "#EBCB8B"
  ui_error: "#D08770"        # nord12 — 4.39:1 on nord0 (nord11 red is only 3.05:1, AA-large)

  # CLI / TUI chrome.
  prompt: "#ECEFF4"
  status_bar_bg: "#3B4252"
  status_bar_text: "#D8DEE9"
  status_bar_strong: "#88C0D0"
  status_bar_dim: "#8FBCBB"  # nord7 — 4.83:1 on nord1 bar (nord3 was 1.36:1, unreadable)
  status_bar_good: "#A3BE8C"
  status_bar_warn: "#EBCB8B"
  status_bar_bad: "#D08770"
  status_bar_critical: "#E5A0AB"  # lightened nord11 — 4.9:1 on bar (pure nord11 is 2.46:1)
  session_label: "#88C0D0"

  # Completion menu — elevated nord1 surface.
  completion_menu_bg: "#3B4252"
  completion_menu_current_bg: "#4C566A"
  completion_menu_meta_bg: "#2E3440"
  completion_menu_meta_current_bg: "#434C5E"
  selection_bg: "#4C566A"    # nord3 as a SELECTION bg is fine (bg, not text); text on it is nord6

  # Syntax highlighting — aurora roles.
  syntax_string: "#A3BE8C"
  syntax_number: "#B48EAD"
  syntax_keyword: "#81A1C1"
  syntax_comment: "#81A1C1"  # nord9 — 4.64:1 on nord0 (nord3 was 1.69:1, invisible)

  # Diff: line bg = aurora color, word fg = polar night (dark-on-color, like the default skin).
  # The renderer paints word text ON the line bg, so light-on-light was unreadable (1.44:1).
  diff_added: "#A3BE8C"
  diff_removed: "#BF616A"
  diff_added_word: "#2E3440"    # 6.13:1 on added bg
  diff_removed_word: "#2E3440"  # 3.05:1 on removed bg (AA-large; bg is mid-luminance)

  shell_dollar: "#81A1C1"
  voice_status_bg: "#3B4252"

# Light-terminal polarity overlay (snow storm background).
light_colors:
  background: "#ECEFF4"
  banner_title: "#5E81AC"
  ui_primary: "#5E81AC"
  banner_accent: "#5E81AC"
  ui_accent: "#5E81AC"
  banner_text: "#2E3440"
  ui_text: "#2E3440"
  banner_dim: "#4C566A"
  ui_label: "#4C566A"
  ui_tool: "#9A7BB0"
  ui_thinking: "#6B9A98"
  banner_border: "#D8DEE9"
  ui_border: "#D8DEE9"
  session_border: "#D8DEE9"
  input_rule: "#5E81AC"
  response_border: "#81A1C1"
  prompt: "#2E3440"
  ui_ok: "#5F8F52"
  ui_warn: "#B08D2E"
  ui_error: "#A34A55"
  status_bar_bg: "#E5E9F0"
  status_bar_text: "#2E3440"
  status_bar_strong: "#5E81AC"
  status_bar_dim: "#4C566A"
  status_bar_good: "#5F8F52"
  status_bar_warn: "#B08D2E"
  status_bar_bad: "#C06A4A"
  status_bar_critical: "#A34A55"
  session_label: "#5E81AC"
  completion_menu_bg: "#E5E9F0"
  completion_menu_current_bg: "#D8DEE9"
  completion_menu_meta_bg: "#ECEFF4"
  completion_menu_meta_current_bg: "#D8DEE9"
  selection_bg: "#D8DEE9"
  syntax_string: "#5F8F52"
  syntax_number: "#9A7BB0"
  syntax_keyword: "#5E81AC"
  syntax_comment: "#7B8AA0"
  diff_added: "#C3D9B5"        # lightened nord14 — light bg, dark word fg below (like default skin)
  diff_removed: "#DCA3AB"      # lightened nord11
  diff_added_word: "#2E3440"    # polar night on light green bg
  diff_removed_word: "#2E3440"  # polar night on light red bg
  shell_dollar: "#5E81AC"
  voice_status_bg: "#E5E9F0"

branding:
  agent_name: Hermes Agent
  prompt_symbol: "❯"
  help_header: "(^_^)? Available Commands"

tool_prefix: "┊"
